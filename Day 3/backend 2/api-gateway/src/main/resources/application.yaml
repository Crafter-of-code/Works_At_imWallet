server:
  port: ${PORT}
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: money-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/money/**

            - id: user-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/users/**
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true