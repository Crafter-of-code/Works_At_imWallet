jwt:
  secret: ${JWT_SECRET}
database:
  url: ${MYSQL_URL}
  username: ${MYSQL_USERNAME}
  password: ${MYSQL_PASSWORD}
server:
  port: ${PORT}
spring:
  application:
    name: backend
  mail:
    host: smtp.gmail.com
    port: ${MAIL_SERVER_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


